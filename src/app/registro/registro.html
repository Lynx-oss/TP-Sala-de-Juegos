<div class="registro-div">
    <form (ngSubmit)="registro()" #registroForm="ngForm" novalidate> 
        <h2>Registro</h2>
        
        <label for="email">Email</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" required placeholder="usuario@gmail.com">

        <label>Contraseña</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" required placeholder="xxxxxx">

        
        <button type="submit">Registrarse</button>
    </form>

    <div class="login-link">
        <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a></p>   
    </div>
</div>
